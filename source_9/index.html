<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Form thông tin cá nhân</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        form {
            width: 400px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            color: blue;
        }

        label {
            display: inline-block;
            width: 100px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"] {
            width: 240px;
            padding: 7px;
            margin-bottom: 10px;
        }

        .hobby {
            margin-left: 105px;
            margin-bottom: 15px;
        }

        .buttons {
            text-align: center;
            margin-top: 15px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 8px 18px;

            cursor: pointer;
        }
    </style>
</head>

<body>

    <form action="#" method="post">

        <h2>THÔNG TIN CÁ NHÂN</h2>

        <div>
            <label for="yourname">Họ và tên:</label>
            <input type="text" id="yourname" name="yourname">
        </div>

        <div>

            <input type="email" id="email" name="email">
        </div>

        </div>

    </form>

</body>
</html>
